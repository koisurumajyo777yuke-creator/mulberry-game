<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>マルベリーの怪</title><style>
*{box-sizing:border-box}html{background:#09090b}body{margin:0;background:#09090b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}.cover{min-height:min-height:100svh;background:url('cover.jpeg') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:0 24px max(8vh,42px)}.cover button,.choice,.utility{border:1px solid #765b85;background:rgba(10,7,13,.9);color:#eee;border-radius:12px;padding:15px 18px;font-size:17px;width:min(540px,100%)}.reader{display:none;max-width:680px;margin:auto;padding:34px 22px 90px;line-height:2;font-size:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px}.reader h1{font-size:20px;font-weight:600;margin:0}.utility{width:auto;padding:8px 11px;font-size:12px;color:#bbb}.story{white-space:pre-wrap}.story strong{font-size:1.22em}.choices{display:grid;gap:12px;margin-top:32px}.small{font-size:12px;color:#888;margin-top:30px;text-align:center}.chapter{color:#a98ab9;font-size:13px;letter-spacing:.08em;margin-bottom:18px}.ending{text-align:center;line-height:2.4}.fade{animation:fade .55s}@keyframes fade{from{opacity:0}to{opacity:1}}button{cursor:pointer}.choice:active{transform:translateY(1px)}
.mapbtn{position:fixed;right:14px;bottom:18px;z-index:20;width:auto;padding:11px 14px;border-radius:999px;background:rgba(10,7,13,.94);box-shadow:0 4px 20px #0008;display:none}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);align-items:center;justify-content:center}.modal.open{display:flex}.modal img{max-width:100%;max-height:100%;object-fit:contain}.closemap{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:46px;height:46px;border-radius:50%;border:1px solid #888;background:#111d;color:white;font-size:26px}
</style></head><body><section id="cover" class="cover"><div style="width:min(540px,100%);display:grid;gap:10px"><img src="Cover.jpeg.PNG"style="width:100%;height:auto;"><button id="start">GAME START</button><button id="continue" style="display:none">続きから</button></div></section><main id="reader" class="reader"><div class="top"><h1>マルベリーの怪</h1><button class="utility" id="reset">最初から</button></div><div id="chapter" class="chapter"></div><div id="story" class="story"></div><div id="choices" class="choices"></div><div class="small">進行状況はこの端末に保存されます</div></main><button class="utility mapbtn" id="mapbtn">間取り図</button><div class="modal" id="mapmodal"><button class="closemap" id="closemap">×</button><img src="map.png" alt="別荘の間取り図"></div><script>
const S={};
function sc(id,ch,text,choices){S[id]={ch,text,choices}}
sc('intro','現在',`妻が、棚の上に置かれていた古い包みを手に取った。\n\n「これ……なんだっけ？」\n\n包みをほどくと、そこには古びた新聞が使われていた。何度も折られ、ところどころ黄ばんでいる。\n\n何気なく開いた紙面の片隅に、小さな記事があった。\n\n――山中の別荘で若い男女死亡。\n\nその見出しを見た瞬間、胸の奥に、説明のできないざわめきが走った。`,[['もう一度、新聞記事を読む','reread'],['妻に聞いてみる','wife'],['新聞を詳しく調べる','inspect']]);
sc('wife','現在',`「この新聞、覚えてる？」\n\n妻はしばらく紙面を見つめた。\n\n「……結婚祝いを包んであった新聞じゃなかった？」\n\nその声を聞きながら、あなたはもう一度記事へ目を落とした。`,[['記事を読み直す','reread']]);
sc('inspect','現在',`新聞をゆっくり広げる。古い折り目の奥から、事件記事が姿を現す。\n\nなぜだろう。見覚えがある。\n\nあなたは、もう一度その記事を読むことにした。`,[['記事を読む','reread']]);
sc('reread','現在',`もう一度、記事へ目を落とす。\n\n見出しは同じだった。\n\nだが――何かが違う。\n\n文字の位置。写真の大きさ。ほんのわずかな違和感。\n\nカサッ……。\n\n風もないのに新聞が鳴った。\n\n次の瞬間、印刷された文字も写真も日付も、すべてが消えていく。\n\n手の中に残ったのは、黄ばんだ、まっさらな新聞だった。\n\n「……ありがとう」\n\n若い男と女の声が、重なるように聞こえた。\n\nそして――遠くから電車の音が近づいてくる。\n\n――あの日だ。まだ、四人だった頃の。`,[['続きを読む','station']]);
sc('station','大学時代',`駅のホーム。\n\n古いベンチ、時刻表、小さな売店。\n\n隣には、まだ大学生だった頃の彼女がいる。\n\n向こうから、二人の友人が歩いてくる。\n\n男友達の腕には古い腕時計。女友達の首元には、小さなペンダント。\n\n四人が揃った。\n\n駅の外には、古い車が待っている。`,[['男友達に別荘のことを聞く','villaTalk'],['二人を追って車へ向かう','car']]);
sc('villaTalk','大学時代',`「その別荘、本当に誰もいないんだろうな？」\n\n男友達は笑った。\n\n「たぶんな」\n\n誰から聞いたのか尋ねると、その笑顔が一瞬だけ消えた。\n\n「……忘れた」\n\n彼は先に駅の出口へ向かった。古い腕時計が、ホームの光を一瞬だけ反射した。`,[['二人を追って車へ向かう','car']]);
sc('car','山道',`四人を乗せた古い車は、町を離れ、山へ向かった。\n\n男友達は助手席で腕時計を直す。\n「ちょっと遅れてるな」\n\n後部座席では、女友達のペンダントが車の揺れに合わせて小さく揺れている。\n\nやがて道は二つに分かれた。`,[['車を止めて地図を確認する','fork']]);
sc('fork','山道',`車を止め、男友達が古い地図を広げた。\n\n彼女が、細い道の先に描かれた建物の印を指す。\n\nそのとき女友達が、右手の暗い山道を見つめたまま言った。\n\n「……そこだよ」\n\n「来たことあるの？」\n\n「……なんとなく」\n\nコン……。\n\n車の屋根で、何かが一度だけ鳴った。`,[['女友達が見ていた右の道へ進む','road']]);
sc('road','山道',`右の道へ入る。\n\n道は次第に細くなり、枝が車体をこすった。\n\n「初めて来るんだから、慎重にな」\n\n男友達の言葉に、あなたは小さな違和感を覚えた。\n\n――初めてなのに、なぜ彼女は右だと分かった？\n\nやがてヘッドライトの先に、古い二階建ての館が浮かび上がった。\n\n車を降りたとき、なぜか二階の一つの窓が目に入った。\n\nそこには、何もいない。`,[['玄関の扉を調べる','front']]);
sc('front','別荘・玄関',`玄関の扉に手をかける。\n\n開かない。鍵がかかっている。\n\n男友達が建物の横を見た。\n「裏に回ってみるか」\n\n女友達が小さく言う。\n\n「……あるよ」\n\n「何が？」\n\n「裏……」\n\nそれ以上、彼女は答えなかった。`,[['玄関をもう一度調べる','frontAgain'],['裏勝手を探しに行く','back']]);
sc('frontAgain','別荘・玄関',`もう一度、扉を押す。\n\nやはり動かない。\n\n鍵穴の奥は真っ暗だった。\n\n背後で、女友達が建物の脇を見ている。`,[['裏勝手を探しに行く','back']]);
sc('back','別荘・裏勝手',`落ち葉の積もった細い通路を進むと、古い木の裏口があった。\n\n男友達が取っ手を回す。\n\nあっけないほど簡単に開いた。\n\n中から、冷たい空気が流れ出す。\n\nカタン。\n\n暗い廊下の奥で、何かが鳴った。\n\n「……誰かいるわけないよな」`,[['四人で中へ入る','inside']]);
sc('inside','別荘・一階',`四人が中へ入った瞬間――\n\nバタン。\n\n背後で裏口が閉まった。\n\n壁には、古びた館内図が掛かっている。居間、和室、台所、ダイニング、洗面所、トイレ、浴室、階段……。\n\n「これなら迷わなくて済みそうだな」\n\nそのとき、どこからともなく古いオルゴールのような旋律が聞こえた。\n\n♪……かごめ……かごめ……`,[['居間へ','living'],['和室へ','washitsu'],['台所へ','kitchen'],['階段から2階へ','stairsEarly']]);
function room(id,name,items,correct,event,next='hall'){sc(id,'別荘・'+name,`薄暗い${name}。\n\n目につくものが三つある。\n\n① ${items[0]}\n② ${items[1]}\n③ ${items[2]}\n\nどれを調べる？`,items.map((x,i)=>[x,id+'_'+(i+1)])); for(let i=1;i<=3;i++){sc(id+'_'+i,'別荘・'+name,`${items[i-1]}を調べる。\n\n大きな変化はない。\n\nもう一つ、気になるものを調べてみる。`,items.map((x,j)=>[x,(i===correct[0]&&j+1===correct[1])?id+'_ok':id+'_retry']));} sc(id+'_retry','別荘・'+name,`……何も起こらない。\n\nだが、部屋を出ようとした手が止まる。\n\nなぜか、このまま出てはいけない気がした。`,[['もう一度、部屋を調べる',id]]); sc(id+'_ok','別荘・'+name,event,[['部屋を出る',next]]);}
room('living','居間',['柱時計','写真立て','引き出し'],[1,3],`引き出しを閉めた。\n\nコトン……。\n\n背後で音がした。\n\n振り返る。\n\n止まっていた柱時計の長針が――\n\n一目盛りだけ進んでいる。\n\n女友達が、小さく呟いた。\n「……始まった」`);
room('washitsu','和室',['座卓','押入れ','掛け軸'],[3,2],`押入れを閉める。\n\nトン。\n\n内側から、一度だけ叩く音がした。\n\n誰も口を開かない。`);
room('kitchen','台所',['食器棚','流し台','冷蔵庫'],[1,2],`流し台から離れようとした瞬間――\n\nカチ……。\n\n誰も触れていない食器が、一度だけ鳴った。`);
room('dining','ダイニング',['椅子','テーブル','古い照明'],[2,1],`ふと振り返る。\n\nさっきまでテーブルの下に収まっていた椅子が、一脚だけ少し後ろへ引かれている。`);
room('washroom','洗面所',['鏡','洗面台','戸棚'],[3,1],`鏡を覗いた瞬間――\n\n背後を、人影のようなものが横切った。\n\n振り返る。\n\n誰もいない。`);
room('toilet','トイレ',['窓','水タンク','棚'],[2,3],`棚を調べ終えた、そのとき。\n\n外から梟の声が聞こえた。\n\nホゥ……。\n\nホゥ……。\n\n二度だけだった。`);
room('entryRoom','玄関',['扉','靴箱','傘立て'],[2,1],`玄関扉に触れる。\n\nカチッ。\n\n鍵の中で音がした。\n\nしかし扉は、まだ開かない。`);
room('backRoom','裏勝手',['裏口','棚','古い履物'],[3,1],`裏口の取っ手が、一瞬だけ動かない。\n\nもう一度触れると、何事もなかったように動いた。`);
sc('hall','別荘・一階',`廊下へ戻った。\n\n館のどこかで、古い木が軋む。\n\nまだ調べていない場所がある。`,[['居間','living'],['和室','washitsu'],['台所','kitchen'],['ダイニング','dining'],['洗面所','washroom'],['トイレ','toilet'],['玄関','entryRoom'],['裏勝手','backRoom'],['階段から2階へ','stairs']]);
sc('stairsEarly','別荘・二階',`階段を上る。\n\n……ミシッ。\n\n二階の廊下は静まり返っていた。寝室、客室、物置。突き当たりには窓がある。\n\nなぜか、何を調べても手応えがない。\n\n女友達が階段の方を見て呟いた。\n\n「……まだ」\n\n一階から、かすかに『かごめかごめ』が聞こえる。`,[['一階へ戻る','hall'],['寝室を調べる','bedNo']]);
sc('bedNo','別荘・二階',`寝室を調べる。\n\n鏡台の鏡に、一瞬だけ奇妙な映り込みが見えた気がした。\n\nしかし何も起こらない。\n\n「ここじゃないんじゃないか？」\n\n男友達が言った。`,[['一階へ戻る','hall']]);
sc('stairs','別荘・二階',`階段を上る。\n\n今度は、空気が違っていた。\n\n二階のどこかで――\n\n……ミシッ。\n\n一度だけ、床が鳴った。`,[['寝室へ','bedroom'],['和室の客室へ','guestJ'],['洋室の客室へ','guestW'],['物置へ','storage'],['二階廊下を調べる','corridor2']]);
room('bedroom','寝室',['ベッド','鏡台','サイドテーブル'],[2,1],`ベッドへ視線を戻す。\n\n掛け布団に、さっきまでなかった窪みがある。\n\nまるで――誰かが、つい今まで腰掛けていたように。`,'upHall');
room('guestJ','和室の客室',['座卓','襖','古い人形'],[1,3],`人形を元の場所へ戻す。\n\nス……。\n\n背後の襖が、数センチだけひとりでに開いた。`,'upHall');
room('guestW','洋室の客室',['机','カーテン','ランプ'],[3,2],`閉じた窓の前で、カーテンが一度だけ揺れた。\n\n風はない。`,'upHall');
room('storage','物置',['木箱','古新聞','アルバム'],[1,3],`アルバムの最後のページ。\n\n写真が一枚、剥がされた跡がある。\n\nそのとき廊下から――\n\n……ミシッ。\n\n誰かの足音が、一度だけ聞こえた。`,'upHall');
room('corridor2','2階廊下',['壁の額','廊下の窓','階段方向'],[1,2],`窓の外。庭の暗がりに、人のような影が立っている。\n\n瞬きをした。\n\nもう、いない。`,'upHall');
sc('upHall','別荘・二階',`二階の廊下へ戻る。\n\n突き当たりの窓だけは、相変わらず何も映していない。\n\nそれなのに、なぜか気になる。`,[['寝室','bedroom'],['和室の客室','guestJ'],['洋室の客室','guestW'],['物置','storage'],['2階廊下','corridor2'],['一階へ戻る','bathReady']]);
sc('bathReady','別荘・一階',`一階へ戻った。\n\n館の中は、不自然なほど静かだった。\n\n残っているのは――浴室。\n\nかすかな『かごめかごめ』が、浴室の方から聞こえる。\n\n女友達が、扉を見たまま言った。\n\n「……開けるの？」\n\n男友達の腕時計が、カチッ、と鳴る。\n女友達のペンダントが、風もないのに揺れた。`,[['浴室の扉を開ける','bath']]);
sc('bath','浴室',`古いタイル張りの浴室。\n\n曇った鏡。錆びた蛇口。\n\nそして――浴槽には、なぜか水が満ちている。\n\n歌が止まった。\n\n黒い水面に、何かが浮かぶ。\n\n古い腕時計。\n\nあなたは男友達を見る。\n\n彼の腕にも――同じ時計がある。\n\n次に、小さなペンダントが水面へ浮かんだ。\n\n女友達の首元にも――同じものがある。\n\nバシャッ。\n\n水面が揺れ、二つは消えた。\n\n振り返る。\n\n男友達と女友達がいない。\n\n四人だったはずなのに。\n\n――二人になっていた。`,[['風呂場から出る','afterBath']]);
sc('afterBath','別荘・一階',`彼女の手を掴み、浴室を出る。\n\n♪……いついつでやる……\n♪……夜明けの晩に……\n\n二階で、床が一度軋んだ。\n\n浴室の鏡を振り返る。\n\n一瞬だけ――四人が映っていた。\n\n次の瞬間には、二人だけ。\n\n♪……鶴と亀が……\n\n歌が途切れた。`,[['裏勝手へ向かう','backExit'],['玄関へ向かう','frontLocked'],['2階へ向かう','upWrong']]);
sc('frontLocked','別荘・玄関',`玄関へ走る。\n\nまだ開かない。\n\n背後の暗い廊下から、子供の声が聞こえた気がした。\n\n……今は、ここではない。`,[['裏勝手へ向かう','backExit']]);
sc('upWrong','別荘・階段',`階段へ足をかける。\n\n二階から、二人分の足音が近づいてくる。\n\n……ミシッ。\n……ミシッ。\n\n彼女が強く腕を引いた。\n「行っちゃだめ」`,[['裏勝手へ向かう','backExit']]);
sc('backExit','別荘・裏勝手',`裏勝手へ走る。\n\n取っ手を回す。\n\n開かない。\n\nここから入ってきたはずなのに。\n\nそのとき――館の反対側から。\n\n……カチッ。\n\n玄関の鍵が開く音。\n\n二階では、二人分の足音が鳴った。\n\n……ミシッ。\n……ミシッ。`,[['玄関へ向かう','escape']]);
sc('escape','別荘・玄関',`玄関へ走る。\n\n最初は開かなかった扉。\n\n取っ手を回す。\n\n――開いた。\n\n二人は外へ飛び出し、車へ向かって走る。\n\n♪……夜明けの晩に……\n♪……鶴と亀が滑った……\n♪……後ろの正面――\n\nそこで歌が止まった。\n\n背中に、視線を感じる。\n\nあの二階の窓から。`,[['後ろを振り返る','lookBack'],['振り返らず走る','noLook']]);
sc('noLook','別荘・外',`振り返らずに走る。\n\nだが、彼女が立ち止まった。\n\n「……ねえ」\n\nその声に、あなたも足を止める。\n\n見ないままでは終われない気がした。`,[['後ろを振り返る','lookBack']]);
sc('lookBack','後ろの正面',`ゆっくり、振り返る。\n\n月明かりの下に、古い館が立っている。\n\n開いたままの玄関。\n\nそして――あの二階の窓。\n\n男友達と女友達が、並んで立っていた。\n\n何も言わない。\n手も振らない。\nただ、こちらを見下ろしている。\n\n耳元で、子供の声。\n\n「……だあれ」`,[['――','presentEnd']]);
sc('presentEnd','現在',`カサッ……。\n\n目を開ける。\n\nいつもの部屋だった。\n\n妻が、古びた新聞を手にしている。\n\n新聞は――まっさらだった。\n\n夢だったのか。記憶だったのか。\nそれとも、もう一度あの夜を歩いたのか。\n\nどこからともなく、二つの声が重なる。\n\n「ありがとう」\n\n窓の外から、子供たちの歌声。\n\n♪……かごめ……かごめ……\n\nあなたは、もう振り返らなかった。`,[['エンディングへ','ending']]);
sc('ending','ENDING',`製作担当　恋する魔女\n\nプログラム担当　ChatGPT\n\nグラフィック担当　ChatGPT\n\n\n\n―― クワ（マルベリー）の花言葉 ――\n\n\n「ともに死のう」\n\n\n\nThe End`,[['最初から読む','intro']]);
const cover=document.getElementById('cover'),reader=document.getElementById('reader'),story=document.getElementById('story'),choices=document.getElementById('choices'),chapter=document.getElementById('chapter');
function safeGet(){try{return window.localStorage?localStorage.getItem('mulberryScene'):null}catch(e){return null}}
function safeSet(id){try{if(window.localStorage)localStorage.setItem('mulberryScene',id)}catch(e){}}
function safeRemove(){try{if(window.localStorage){localStorage.removeItem('mulberryScene');localStorage.removeItem('mulberryMap')}}catch(e){}}
function mapOwned(){try{return localStorage.getItem('mulberryMap')==='1'}catch(e){return false}}
function show(id){
if(id==='inside'){try{localStorage.setItem('mulberryMap','1')}catch(e){}}const s=S[id]||S.intro;safeSet(id);cover.style.display='none';reader.style.display='block';document.getElementById('mapbtn').style.display=(mapOwned() && id!=='ending' && id!=='presentEnd')?'block':'none';chapter.textContent=s.ch||'';reader.classList.remove('fade');void reader.offsetWidth;reader.classList.add('fade');story.textContent=s.text.replaceAll('**','');story.className=id==='ending'?'story ending':'story';choices.innerHTML='';s.choices.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{show(next);scrollTo({top:0,behavior:'smooth'})};choices.appendChild(b)});}
const mm=document.getElementById('mapmodal');document.getElementById('mapbtn').onclick=()=>mm.classList.add('open');document.getElementById('closemap').onclick=()=>mm.classList.remove('open');mm.onclick=e=>{if(e.target===mm)mm.classList.remove('open')};
const cont=document.getElementById('continue');if(safeGet())cont.style.display='block';document.getElementById('start').addEventListener('click',function(e){e.preventDefault();safeRemove();show('intro');});cont.addEventListener('click',function(e){e.preventDefault();show(safeGet()||'intro');});document.getElementById('reset').onclick=()=>{if(confirm('最初から読み直しますか？')){safeRemove();show('intro');window.scrollTo(0,0)}};
</script></body></html>
