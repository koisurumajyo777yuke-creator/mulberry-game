<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>通りゃんせ</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic",Meiryo,sans-serif}
button{font:inherit}
#app{min-height:100dvh;display:flex;justify-content:center;background:#050505}
.phone{position:relative;width:min(100vw,520px);min-height:100dvh;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .22s ease}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,rgba(0,0,0,.08) 22%,rgba(0,0,0,.05) 64%,rgba(0,0,0,.58) 100%)}
.topbar{position:absolute;z-index:10;top:calc(var(--safe-top) + 16px);left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.chip{padding:9px 14px;border-radius:999px;background:rgba(24,24,24,.58);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.story{position:absolute;z-index:10;left:24px;right:24px;bottom:calc(var(--safe-bottom) + 132px);color:#fff;font-size:clamp(18px,4.5vw,24px);line-height:1.75;font-weight:750;text-shadow:0 2px 3px #000,0 0 7px rgba(0,0,0,.95),1px 1px 1px #000}
.story.small{font-size:clamp(16px,4.1vw,21px)}
.story.ladybug{right:auto;width:66%;bottom:calc(var(--safe-bottom) + 140px)}
.speaker{display:block;margin-bottom:8px;font-size:.78em;opacity:.88;font-weight:800}
.controls{position:absolute;z-index:12;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:56px;padding:12px 14px;color:#fff;background:rgba(8,8,8,.72);border:1px solid rgba(255,255,255,.28);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:800;font-size:17px}
.btn:active{transform:scale(.985)} .btn.full{grid-column:1/-1}.btn.secondary{opacity:.92}.time-guide{min-height:58px}
.wipe{position:absolute;z-index:30;top:0;bottom:0;width:3px;opacity:0;pointer-events:none;background:rgba(255,255,255,.95);box-shadow:0 0 10px 3px rgba(255,255,255,.6)}
.wipe.go-right{animation:wipeRight .55s ease-in-out}.wipe.go-left{animation:wipeLeft .55s ease-in-out}
@keyframes wipeRight{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
@keyframes wipeLeft{0%{left:100%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:0;opacity:0}}
.flash{position:absolute;z-index:40;inset:0;pointer-events:none;background:#fff;opacity:0}.flash.on{animation:flash .45s ease}
@keyframes flash{0%{opacity:0}18%{opacity:.92}35%{opacity:.08}100%{opacity:0}}
.title-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;background:radial-gradient(circle at 50% 25%,rgba(130,0,0,.28),transparent 38%),linear-gradient(#050608,#131010 55%,#030303);text-align:center}
.title{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(42px,11vw,64px);font-weight:800;letter-spacing:.16em;margin-left:.16em;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.subtitle{margin-top:12px;font-size:15px;opacity:.76;letter-spacing:.12em}.start{margin-top:70px;width:min(84%,340px)}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"><main class="phone">
<section id="titleScreen" class="title-screen">
  <div class="title">通りゃんせ</div>
  <div class="subtitle">この世と、あの世の、まんなかで</div>
  <button id="startBtn" class="btn start">はじめから</button>
</section>
<section id="gameScreen" class="screen hidden">
  <img id="bg" class="bg" alt="">
  <div class="vignette"></div>
  <div class="topbar"><div id="sceneLabel" class="chip">場面</div><div id="timeLabel" class="chip">現在</div></div>
  <div id="story" class="story"></div>
  <div class="controls">
    <button id="leftBtn" class="btn secondary">前へ</button>
    <button id="rightBtn" class="btn">次へ</button>
    <button id="timeBtn" class="btn full time-guide hidden">左 → 右　過去へ</button>
  </div>
  <div id="wipe" class="wipe"></div><div id="flash" class="flash"></div>
</section>
</main></div>
<script>
// iPhone「ファイル」で名前変更すると、GitHub側で .png.PNG のように見える場合があるため、
// .png / .PNG / .png.PNG を自動で順番に試します。
function candidates(base){
  return [base+".png", base+".PNG", base+".png.PNG", base+".png .PNG"];
}
const ASSETS={
  izakaya:candidates("01_izakaya"),
  station:candidates("02_station"),
  train:candidates("03_train"),
  currentCrossing:candidates("04_current_crossing"),
  currentLadybug:candidates("05_current_ladybug"),
  pastCrossing:candidates("06_past_crossing"),
  pastLadybug:candidates("07_past_ladybug"),
  currentSignal:candidates("08_current_signal"),
  pastSignal:candidates("09_past_signal"),
  conductorWake:candidates("10_conductor_wake"),
  awake:candidates("11_awake")
};

const scenes=[
 {image:ASSETS.izakaya,time:"現在",label:"居酒屋",speaker:"主人公",text:"今日は、散々な一日だった。<br><br>仕事でも怒られ、気づけばこんな時間だ。",textClass:"small"},
 {image:ASSETS.station,time:"現在",label:"終電",speaker:"主人公",text:"店を出ると、もう終電の時間だった。<br><br>人気の少ないホームへ、電車が滑り込んでくる。",textClass:"small"},
 {image:ASSETS.train,time:"現在",label:"車内",speaker:"主人公",text:"座った途端、身体から力が抜けた。<br><br>目を閉じたのは、ほんの少しのつもりだった。",textClass:"small"},
 {pair:true,label:"交差点",
  current:{image:ASSETS.currentCrossing,time:"現在",speaker:"主人公",text:"見覚えのある交差点。<br><br>なぜだろう。胸の奥に、妙な引っかかりが残る。"},
  past:{image:ASSETS.pastCrossing,time:"過去",speaker:"主人公",text:"似ている。<br><br>けれど、ここは同じ場所ではない。<br>空気も、街並みも、ずっと昔だ。"}},
 {pair:true,ladybug:true,label:"ナナホシテントウ",
  current:{image:ASSETS.currentLadybug,time:"現在",speaker:"主人公",text:"上着の胸ポケットに、一匹のナナホシテントウがとまっていた。<br><br>虫の知らせかな……。何か、嫌な感じがする。"},
  past:{image:ASSETS.pastLadybug,time:"過去",speaker:"父",text:"父の胸ポケットにも、ナナホシテントウが一匹とまっていた。<br><br>「虫の知らせか……。何もなければいいが」"}},
 {pair:true,label:"信号",
  current:{image:ASSETS.currentSignal,time:"現在",speaker:"主人公",text:"信号が赤に変わる、その少し前。<br><br>嫌な感じが消えない。<br>俺は思わず、一歩だけ後ろへ下がった。"},
  past:{image:ASSETS.pastSignal,time:"過去",speaker:"過去",text:"父はまだ、交差点の手前にいる。<br><br>信号の向こう側だけが、妙に遠く感じられた。"}},
 {image:ASSETS.pastSignal,time:"過去",label:"最後の恩返し",speaker:"主人公",text:"「お父さんー！　お父さんー！」<br><br>父が振り返る。<br><br>「どうした？」<br><br>「……今まで、ありがとう。」",textClass:"small",flashAfter:true},
 {image:ASSETS.conductorWake,time:"現在",label:"終点",speaker:"車掌",text:"「お客さん、お客さん。<br>そろそろ終点ですよ！」",textClass:"small"},
 {image:ASSETS.awake,time:"現在",label:"車内",speaker:"主人公",text:"はっと目を開けた。<br><br>胸の奥に残っていた重さが、少しだけ消えていた。",textClass:"small"}
];

const titleScreen=document.getElementById("titleScreen"),gameScreen=document.getElementById("gameScreen"),startBtn=document.getElementById("startBtn"),
bg=document.getElementById("bg"),story=document.getElementById("story"),sceneLabel=document.getElementById("sceneLabel"),timeLabel=document.getElementById("timeLabel"),
leftBtn=document.getElementById("leftBtn"),rightBtn=document.getElementById("rightBtn"),timeBtn=document.getElementById("timeBtn"),
wipe=document.getElementById("wipe"),flash=document.getElementById("flash");

let sceneIndex=0,era="current",touchStartX=0,touchStartY=0,locked=false,currentCandidates=[],candidateIndex=0;

function loadImage(list){
  currentCandidates=list.slice(); candidateIndex=0; tryImage();
}
function tryImage(){
  if(candidateIndex>=currentCandidates.length){
    story.innerHTML='<span class="speaker">画像エラー</span>画像ファイル名を確認してください。';
    return;
  }
  bg.src=currentCandidates[candidateIndex++];
}
bg.addEventListener("error",tryImage);

function s(){return scenes[sceneIndex]}
function render(){
  const sc=s(),view=sc.pair?(era==="current"?sc.current:sc.past):sc;
  loadImage(view.image);
  sceneLabel.textContent=sc.label||""; timeLabel.textContent=view.time||"現在";
  story.className="story"; if(sc.textClass)story.classList.add(sc.textClass); if(sc.ladybug)story.classList.add("ladybug");
  story.innerHTML=(view.speaker?`<span class="speaker">${view.speaker}</span>`:"")+(view.text||"");
  leftBtn.textContent=sceneIndex===0?"タイトルへ":"前へ";
  rightBtn.textContent=sceneIndex===scenes.length-1?"最初から":"次へ";
  if(sc.pair){timeBtn.classList.remove("hidden");timeBtn.textContent=era==="current"?"左 → 右　過去へ":"右 → 左　現在へ"}
  else timeBtn.classList.add("hidden");
}
function next(){
  if(locked)return;
  if(s().flashAfter){flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on")}
  sceneIndex=sceneIndex>=scenes.length-1?0:sceneIndex+1;era="current";render();
}
function prev(){
  if(locked)return;
  if(sceneIndex===0){gameScreen.classList.add("hidden");titleScreen.classList.remove("hidden");return}
  sceneIndex--;era="current";render();
}
function changeEra(target){
  const sc=s();if(!sc.pair||locked||era===target)return;locked=true;
  const past=target==="past";wipe.className="wipe";void wipe.offsetWidth;wipe.classList.add(past?"go-right":"go-left");
  setTimeout(()=>{era=target;render()},260);
  setTimeout(()=>{wipe.className="wipe";locked=false},580);
}
startBtn.onclick=()=>{titleScreen.classList.add("hidden");gameScreen.classList.remove("hidden");sceneIndex=0;era="current";render()};
leftBtn.onclick=prev;rightBtn.onclick=next;timeBtn.onclick=()=>changeEra(era==="current"?"past":"current");
gameScreen.addEventListener("touchstart",e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});
gameScreen.addEventListener("touchend",e=>{if(!s().pair)return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;changeEra(dx>0?"past":"current")},{passive:true});
</script>
</body></html>
