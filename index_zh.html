sc('intro','现在',`妻子从架子上拿起一个放了很久的旧包裹。

“这是什么来着……？”

报纸的一角，有一篇很小的报道。

——山中别墅发现一对年轻男女死亡。

看到标题的瞬间，一种无法解释的不安从心底涌了上来。`,[["再读一遍报纸上的报道","reread"],["问问妻子","wife"],["仔细查看这张报纸","inspect"]]);
sc('wife','现在',`“你还记得这张报纸吗？”

sc('inspect','现在',`我慢慢展开报纸。

sc('reread','现在',`我再次低头看向那篇报道。

标题明明和刚才一样。

沙沙……

明明没有风，报纸却自己动了一下。

紧接着，就在我的眼前，所有印刷的文字、照片，甚至日期都开始一点点消失。

最后留在我手中的，只是一张泛黄的旧报纸——上面一片空白。

“……谢谢。”

一男一女的声音重叠在一起。

随后——远处传来了越来越近的列车声。

那一天。

我们四个人还都在的时候。`,[["继续","station"]]);
sc('station','大学时代',`车站站台。

站在我身边的，是后来成为我妻子的她。那时，我们都还是大学生。

男生戴着一块旧手表，女生的脖子上挂着一枚小吊坠。

车站外，一辆老旧的汽车正等着我们。`,[["问朋友那栋别墅的事","villaTalk"],["跟他们一起去车上","car"]]);
sc('villaTalk','大学时代',`“你确定那栋别墅现在没人住吧？”

sc('car','山路',`老旧的汽车载着我们四个人离开城镇，驶向山区。

坐在副驾驶的朋友调了调手表。

“好像慢了一点。”

sc('fork','山路',`我们把车停下，朋友展开了一张旧地图。

sc('road','山路',`我们驶进了右侧的道路。

我下车时，目光不由自主地看向二楼的一扇窗户。

sc('front','别墅 — 正门',`我试着推了推正门。

sc('frontAgain','别墅 — 正门',`我又推了一次门。

sc('back','别墅 — 后门',`我们沿着铺满落叶的狭窄小路绕到后面，找到了一扇老旧的木门。

sc('inside','别墅 — 一楼',`就在我们四个人全部踏进屋内的那一刻——

sc('hall','别墅 — 一楼',`你回到走廊。

别墅某处传来老木头吱呀作响的声音。

还有一些地方没有调查。`,[["客厅","living"],["和室","washitsu"],["厨房","kitchen"],["餐厅","dining"],["洗手间","washroom"],["厕所","toilet"],["正门","entryRoom"],["后门","backRoom"],["浴室","bathCheck"],["上楼","stairs"]]);
sc('stairsEarly','别墅 — 二楼',`你走上楼梯。

sc('bedNo','别墅 — 二楼',`你调查了卧室。

room('bedroom','卧室',["床","梳妆台","床头柜"],[2, 1],`你回头看向床。

sc('upHall','别墅 — 二楼',`你回到二楼走廊。

sc('hallAfter2F','别墅 — 一楼',`你从二楼回到一楼。

sc('bathCheck','浴室门外',`你停在浴室门前。

sc('bathReady','别墅 — 一楼',`你回到一楼。

sc('bath','浴室',`一间铺着老旧瓷砖的浴室。
