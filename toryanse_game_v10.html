<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>通りゃんせ</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic",Meiryo,sans-serif}
button{font:inherit}
#app{min-height:100dvh;display:flex;justify-content:center;background:#050505}
.phone{position:relative;width:min(100vw,520px);min-height:100dvh;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .22s ease}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,rgba(0,0,0,.08) 22%,rgba(0,0,0,.05) 64%,rgba(0,0,0,.6) 100%)}
.topbar{position:absolute;z-index:10;top:calc(var(--safe-top) + 16px);left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.chip{padding:9px 14px;border-radius:999px;background:rgba(24,24,24,.58);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.story{position:absolute;z-index:10;left:24px;right:24px;bottom:calc(var(--safe-bottom) + 142px);color:#fff;font-size:clamp(18px,4.5vw,24px);line-height:1.72;font-weight:750;text-shadow:0 2px 3px #000,0 0 7px rgba(0,0,0,.95),1px 1px 1px #000}
.story.small{font-size:clamp(16px,4.1vw,21px)}
.story.high{bottom:calc(var(--safe-bottom) + 176px)}
.story.ladybug{right:auto;width:67%;bottom:calc(var(--safe-bottom) + 152px)}
.speaker{display:block;margin-bottom:8px;font-size:.78em;opacity:.9;font-weight:800}
.controls{position:absolute;z-index:12;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:56px;padding:12px 14px;color:#fff;background:rgba(8,8,8,.74);border:1px solid rgba(255,255,255,.28);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:800;font-size:17px}
.btn:active{transform:scale(.985)}
.btn.full{grid-column:1/-1}
.btn.secondary{opacity:.92}
.time-guide{min-height:58px}
.wipe{position:absolute;z-index:30;top:0;bottom:0;width:3px;opacity:0;pointer-events:none;background:rgba(255,255,255,.97);box-shadow:0 0 10px 3px rgba(255,255,255,.65)}
.wipe.go-right{animation:wipeRight .55s ease-in-out}
.wipe.go-left{animation:wipeLeft .55s ease-in-out}
@keyframes wipeRight{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
@keyframes wipeLeft{0%{left:100%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:0;opacity:0}}
.flash{position:absolute;z-index:40;inset:0;pointer-events:none;background:#fff;opacity:0}.flash.on{animation:flash .45s ease}
@keyframes flash{0%{opacity:0}18%{opacity:.92}35%{opacity:.08}100%{opacity:0}}
.title-screen{position:absolute;inset:0;background:#050505;overflow:hidden}
.title-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.start-hotspot{position:absolute;z-index:4;left:25%;right:18%;top:61.2%;height:7.5%;border:0;border-radius:18px;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.start-hotspot:active{background:rgba(255,255,255,.06)}

.ending-screen{
  position:absolute;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}
.ending-credits{
  position:absolute;
  left:24px;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  font-size:clamp(18px,4.7vw,25px);
  line-height:2.25;
  letter-spacing:.08em;
  color:#f5f5f5;
  opacity:0;
  text-shadow:0 1px 7px rgba(255,255,255,.15);
}
.ending-credits.play{
  animation:creditsFade 5.2s ease forwards;
}
@keyframes creditsFade{
  0%{opacity:0;transform:translateY(-46%)}
  15%{opacity:1;transform:translateY(-50%)}
  72%{opacity:1}
  100%{opacity:0;transform:translateY(-55%)}
}
.ending-kanji{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  font-size:clamp(88px,28vw,150px);
  font-weight:600;
  letter-spacing:.05em;
  color:#f4f4f4;
  opacity:0;
  transform:scale(.88);
  text-shadow:0 0 18px rgba(255,255,255,.12);
}
.ending-kanji.play{
  animation:kanjiAppear 4.2s ease forwards;
}
@keyframes kanjiAppear{
  0%{opacity:0;transform:scale(.88);filter:blur(4px)}
  35%{opacity:.82;filter:blur(1px)}
  70%{opacity:1;transform:scale(1.03);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}
.ending-home{
  position:absolute;
  left:50%;
  bottom:calc(var(--safe-bottom) + 30px);
  transform:translateX(-50%);
  min-width:150px;
  min-height:48px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.72);
  font-size:14px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
}
.ending-home.show{
  animation:homeFade 1.2s ease forwards;
  pointer-events:auto;
}
@keyframes homeFade{
  from{opacity:0}
  to{opacity:1}
}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"><main class="phone">
<section id="titleScreen" class="title-screen">
  <img class="title-bg" src="00_start.PNG?v=9" alt="通りゃんせ スタート画面">
  <button id="startBtn" class="start-hotspot" aria-label="はじめから">はじめから</button>
</section>

<section id="gameScreen" class="screen hidden">
  <img id="bg" class="bg" alt="">
  <div class="vignette"></div>
  <div class="topbar">
    <div id="sceneLabel" class="chip">場面</div>
    <div id="timeLabel" class="chip">現在</div>
  </div>
  <div id="story" class="story"></div>
  <div class="controls">
    <button id="leftBtn" class="btn secondary">前へ</button>
    <button id="rightBtn" class="btn">次へ</button>
    <button id="timeBtn" class="btn full time-guide hidden">左 → 右　過去へ</button>
  </div>
  <div id="wipe" class="wipe"></div>
  <div id="flash" class="flash"></div>
</section>

<section id="endingScreen" class="ending-screen hidden">
  <div id="endingCredits" class="ending-credits">
    制作担当　恋する魔女<br>
    プログラム担当　ChatGPT<br>
    グラフィック担当　ChatGPT
  </div>
  <div id="endingKanji" class="ending-kanji">終</div>
  <button id="endingHome" class="ending-home">タイトルへ</button>
</section>
</main></div>

<script>
function candidates(base){
  return [
    base+".png", base+".PNG", base+".jpg", base+".jpeg",
    base+" .PNG", base+" .png",
    base+".png.PNG", base+".png .PNG", base+".PNG.PNG", base
  ];
}
const ASSETS={
  izakaya:candidates("01_izakaya"),
  station:candidates("02_station"),
  train:candidates("03_train"),
  currentCrossing:candidates("04_current_crossing"),
  currentLadybug:candidates("05_current_ladybug"),
  pastCrossing:candidates("06_past_crossing"),
  pastLadybug:candidates("07_past_ladybug"),
  currentSignal:candidates("08_current_signal"),
  pastSignal:candidates("09_past_signal"),
  conductorWake:candidates("10_conductor_wake"),
  awake:candidates("11_awake"),

  shopping:["%20%20%20%2012_shopping.PNG?v=8"],
  fatherHelp:["%20%20%20%2013_father_help.PNG?v=8"],
  tea:["%20%20%20%2014_tea.PNG?v=8"],
  familyDinner:["15_family_dinner%20.PNG?v=8"],
  familyPhoto:["%20%20%20%2016_family_photo.PNG?v=8"],
  shoulderMassage:["%20%20%20%2017_shoulder_massage.PNG?v=8"],
  ladybugLesson:["%20%20%20%2018_ladybug_lesson.PNG?v=8"]
};

const scenes=[
 {image:ASSETS.izakaya,time:"現在",label:"居酒屋",speaker:"主人公",
  text:"今日は、散々な一日だった。<br><br>仕事でも怒られ、気づけばこんな時間だ。",textClass:"small"},
 {image:ASSETS.station,time:"現在",label:"終電",speaker:"主人公",
  text:"店を出ると、もう終電の時間だった。<br><br>人気の少ないホームへ、電車が滑り込んでくる。",textClass:"small"},
 {image:ASSETS.train,time:"現在",label:"車内",speaker:"主人公",
  text:"座った途端、身体から力が抜けた。<br><br>目を閉じたのは、ほんの少しのつもりだった。",textClass:"small"},

 {pair:true,label:"交差点",textClass:"high",
  current:{image:ASSETS.currentCrossing,time:"現在",speaker:"主人公",
           text:"見覚えのある交差点。<br><br>なぜだろう。胸の奥に、妙な引っかかりが残る。"},
  past:{image:ASSETS.pastCrossing,time:"過去",speaker:"主人公",
        text:"似ている。<br><br>けれど、ここは同じ場所ではない。<br>空気も、街並みも、ずっと昔だ。"}},

 {pair:true,ladybug:true,label:"ナナホシテントウ",
  current:{image:ASSETS.currentLadybug,time:"現在",speaker:"主人公",
           text:"上着の胸ポケットに、一匹のナナホシテントウがとまっていた。<br><br>虫の知らせかな……。何か、嫌な感じがする。"},
  past:{image:ASSETS.pastLadybug,time:"過去",speaker:"父",
        text:"父の胸ポケットにも、ナナホシテントウが一匹とまっていた。<br><br>「虫の知らせか……。何もなければいいが」"}},

 {image:ASSETS.ladybugLesson,time:"過去",label:"虫の知らせ",speaker:"子どもの主人公",
  text:"「お父さん、それ何？」<br><br>父は肩のナナホシテントウを指さした。<br><br>「こういうのを“虫の知らせ”って言うんだ。覚えておけよ！」",textClass:"small high"},

 {image:ASSETS.shopping,time:"過去",label:"恩返し 1 / 6",speaker:"主人公",
  text:"母の買い物について行き、両手いっぱいの荷物を持った。<br><br>母「ありがとうね。助かったよ」",textClass:"small high"},

 {image:ASSETS.fatherHelp,time:"過去",label:"恩返し 2 / 6",speaker:"父",
  text:"「これ、押さえてくれるか？」<br><br>主人公「うん」<br><br>父「ありがとうな。助かった」",textClass:"small high"},

 {image:ASSETS.tea,time:"過去",label:"恩返し 3 / 6",speaker:"主人公",
  text:"父と母に、お茶を入れた。<br><br>母「ありがとうね」",textClass:"small high"},

 {image:ASSETS.familyDinner,time:"過去",label:"恩返し 4 / 6",speaker:"主人公",
  text:"その夜は、急いで席を立たずに、父と母の話を聞いた。<br><br>母「今日は付き合ってくれて、ありがとうね」",textClass:"small high"},

 {image:ASSETS.familyPhoto,time:"過去",label:"恩返し 5 / 6",speaker:"主人公",
  text:"三人で、家族写真を撮った。<br><br>母「ありがとうね。いい写真になったね」",textClass:"small high"},

 {image:ASSETS.shoulderMassage,time:"過去",label:"恩返し 6 / 6",speaker:"父",
  text:"「お、気持ちいいな。ありがとうな」<br><br>主人公は、ようやく気づいた。<br><br>「……こんなことで、よかったんだ。」",textClass:"small high"},

 {image:ASSETS.train,time:"現在",label:"終点",speaker:"車内アナウンス",
  text:"「次は終点、次は終点。<br>お忘れ物のないよう願います。」<br><br>主人公は、もう一度ゆっくり目を閉じた。",textClass:"small"},

 {pair:true,label:"信号",textClass:"high",
  current:{image:ASSETS.currentSignal,time:"現在",speaker:"主人公",
           text:"信号が赤に変わる、その少し前。<br><br>嫌な感じが消えない。<br>俺は思わず、一歩だけ後ろへ下がった。"},
  past:{image:ASSETS.pastSignal,time:"過去",speaker:"地の文",
        text:"父はまだ、交差点の手前にいる。<br><br>信号の向こう側だけが、妙に遠く感じられた。"}},

 {image:ASSETS.pastSignal,time:"過去",label:"最後の恩返し",speaker:"主人公",
  text:"「お父さんー！　お父さんー！」<br><br>父が振り返る。<br><br>「どうした？」<br><br>「……今まで、ありがとう。」",textClass:"small high",flashAfter:true},

 {image:ASSETS.train,time:"現在",label:"境目",speaker:"父の声",
  text:"「ありがとうな。<br>もう大丈夫だ。」",textClass:"high"},

 {image:ASSETS.conductorWake,time:"現在",label:"終点",speaker:"車掌",
  text:"「お客さん、お客さん。<br>そろそろ終点ですよ！」",textClass:"small"},

 {image:ASSETS.awake,time:"現在",label:"車内",speaker:"主人公",
  text:"はっと目を開けた。<br><br>胸の奥に残っていた重さが、少しだけ消えていた。",textClass:"small"}
];

const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");
const startBtn=document.getElementById("startBtn");
const bg=document.getElementById("bg");
const story=document.getElementById("story");
const sceneLabel=document.getElementById("sceneLabel");
const timeLabel=document.getElementById("timeLabel");
const leftBtn=document.getElementById("leftBtn");
const rightBtn=document.getElementById("rightBtn");
const timeBtn=document.getElementById("timeBtn");
const wipe=document.getElementById("wipe");
const flash=document.getElementById("flash");
const endingScreen=document.getElementById("endingScreen");
const endingCredits=document.getElementById("endingCredits");
const endingKanji=document.getElementById("endingKanji");
const endingHome=document.getElementById("endingHome");

let sceneIndex=0,era="current",touchStartX=0,touchStartY=0,locked=false;
let imageRequestId=0,lastTime="現在";

function loadImage(list){
  const requestId=++imageRequestId;
  const urls=list.slice();
  let i=0;

  function attempt(){
    if(requestId!==imageRequestId) return;
    if(i>=urls.length){
      story.innerHTML='<span class="speaker">画像エラー</span>画像ファイル名を確認してください。';
      return;
    }

    const url=urls[i++];
    const probe=new Image();

    probe.onload=()=>{
      if(requestId!==imageRequestId) return;
      bg.src=url;
    };

    probe.onerror=()=>{
      if(requestId!==imageRequestId) return;
      attempt();
    };

    probe.src=url;
  }

  attempt();
}

function preloadAll(){
  const groups=Object.values(ASSETS);
  groups.forEach(list=>{
    const im=new Image();
    let i=0;
    im.onerror=()=>{i++; if(i<list.length) im.src=list[i];};
    im.src=list[0];
  });
}
window.addEventListener("load",()=>setTimeout(preloadAll,250));

function currentScene(){return scenes[sceneIndex]}
function currentView(){
  const sc=currentScene();
  return sc.pair?(era==="current"?sc.current:sc.past):sc;
}
function render(){
  const sc=currentScene(),view=currentView();
  loadImage(view.image);
  sceneLabel.textContent=sc.label||"";
  timeLabel.textContent=view.time||"現在";

  story.className="story";
  const classes=(sc.textClass||"").split(/\s+/).filter(Boolean);
  classes.forEach(c=>story.classList.add(c));
  if(sc.ladybug)story.classList.add("ladybug");
  story.innerHTML=(view.speaker?`<span class="speaker">${view.speaker}</span>`:"")+(view.text||"");

  leftBtn.textContent=sceneIndex===0?"タイトルへ":"前へ";
  rightBtn.textContent=sceneIndex===scenes.length-1?"最初から":"次へ";

  if(sc.pair){
    timeBtn.classList.remove("hidden");
    timeBtn.textContent=era==="current"?"左 → 右　過去へ":"右 → 左　現在へ";
  }else{
    timeBtn.classList.add("hidden");
  }
  lastTime=view.time||"現在";
}
function playEnding(){
  gameScreen.classList.add("hidden");
  endingScreen.classList.remove("hidden");

  endingCredits.classList.remove("play");
  endingKanji.classList.remove("play");
  endingHome.classList.remove("show");
  void endingCredits.offsetWidth;

  endingCredits.classList.add("play");

  setTimeout(()=>{
    endingKanji.classList.add("play");
  }, 5000);

  setTimeout(()=>{
    endingHome.classList.add("show");
  }, 8400);
}

function next(){
  if(locked)return;
  const sc=currentScene();
  if(sc.flashAfter){
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
  }
  if(sceneIndex>=scenes.length-1){
    playEnding();
    return;
  }
  sceneIndex++;
  era="current";
  render();
}
function prev(){
  if(locked)return;
  if(sceneIndex===0){
    gameScreen.classList.add("hidden");
    titleScreen.classList.remove("hidden");
    return;
  }
  sceneIndex--;
  era="current";
  render();
}
function changeEra(target){
  const sc=currentScene();
  if(!sc.pair||locked||era===target)return;
  locked=true;
  const past=target==="past";
  wipe.className="wipe"; void wipe.offsetWidth;
  wipe.classList.add(past?"go-right":"go-left");
  setTimeout(()=>{era=target;render()},260);
  setTimeout(()=>{wipe.className="wipe";locked=false},580);
}
startBtn.onclick=()=>{
  titleScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  sceneIndex=0; era="current"; render();
};
endingHome.onclick=()=>{
  endingScreen.classList.add("hidden");
  titleScreen.classList.remove("hidden");
  sceneIndex=0;
  era="current";
};
leftBtn.onclick=prev;
rightBtn.onclick=next;
timeBtn.onclick=()=>changeEra(era==="current"?"past":"current");

gameScreen.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0]; touchStartX=t.clientX; touchStartY=t.clientY;
},{passive:true});
gameScreen.addEventListener("touchend",e=>{
  if(!currentScene().pair)return;
  const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;
  changeEra(dx>0?"past":"current");
},{passive:true});
</script>
</body>
</html>
