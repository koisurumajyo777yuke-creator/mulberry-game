<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toryanse</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit}
#app{min-height:100dvh;display:flex;justify-content:center;background:#050505}
.phone{position:relative;width:min(100vw,520px);min-height:100dvh;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;background:#000;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .22s ease}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.42) 0%,rgba(0,0,0,.08) 22%,rgba(0,0,0,.05) 64%,rgba(0,0,0,.6) 100%)}
.topbar{position:absolute;z-index:10;top:calc(var(--safe-top) + 16px);left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.chip{padding:9px 14px;border-radius:999px;background:rgba(24,24,24,.58);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.story{position:absolute;z-index:10;left:24px;right:24px;bottom:calc(var(--safe-bottom) + 142px);color:#fff;font-size:clamp(18px,4.5vw,24px);line-height:1.72;font-weight:750;text-shadow:0 2px 3px #000,0 0 7px rgba(0,0,0,.95),1px 1px 1px #000}
.story.small{font-size:clamp(16px,4.1vw,21px)}
.story.high{bottom:calc(var(--safe-bottom) + 176px)}
.story.ladybug{right:auto;width:67%;bottom:calc(var(--safe-bottom) + 152px)}
.speaker{display:block;margin-bottom:8px;font-size:.78em;opacity:.9;font-weight:800}
.controls{position:absolute;z-index:12;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:56px;padding:12px 14px;color:#fff;background:rgba(8,8,8,.74);border:1px solid rgba(255,255,255,.28);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:800;font-size:17px}
.btn:active{transform:scale(.985)}
.btn.full{grid-column:1/-1}
.btn.secondary{opacity:.92}
.time-guide{min-height:58px}
.wipe{position:absolute;z-index:35;top:0;bottom:0;left:0;width:5px;opacity:0;pointer-events:none;background:#fff;box-shadow:0 0 16px 5px rgba(255,255,255,.92);will-change:left,opacity}
.wipe.go-right{animation:wipeRight .95s linear}
.wipe.go-left{animation:wipeLeft .95s linear}
@keyframes wipeRight{0%{left:0;opacity:0}5%{opacity:1}95%{opacity:1}100%{left:calc(100% - 5px);opacity:0}}
@keyframes wipeLeft{0%{left:calc(100% - 5px);opacity:0}5%{opacity:1}95%{opacity:1}100%{left:0;opacity:0}}
.flash{position:absolute;z-index:40;inset:0;pointer-events:none;background:#fff;opacity:0}.flash.on{animation:flash .45s ease}
@keyframes flash{0%{opacity:0}18%{opacity:.92}35%{opacity:.08}100%{opacity:0}}
.title-screen{position:absolute;inset:0;background:#050505;overflow:hidden}
.title-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.start-hotspot{position:absolute;z-index:4;left:25%;right:18%;top:61.2%;height:7.5%;border:0;border-radius:18px;background:transparent;color:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.start-hotspot:active{background:rgba(255,255,255,.06)}
.en-test-note{position:absolute;z-index:5;left:20px;right:20px;bottom:calc(var(--safe-bottom) + 18px);text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.82);text-shadow:0 1px 5px #000;pointer-events:none}

.ending-screen{
  position:absolute;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
}
.ending-credits{
  position:absolute;
  left:24px;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  font-size:clamp(18px,4.7vw,25px);
  line-height:2.25;
  letter-spacing:.08em;
  color:#f5f5f5;
  opacity:0;
  text-shadow:0 1px 7px rgba(255,255,255,.15);
}
.ending-credits.play{
  animation:creditsFade 3.2s ease forwards;
}
@keyframes creditsFade{
  0%{opacity:0;transform:translateY(-46%)}
  15%{opacity:1;transform:translateY(-50%)}
  72%{opacity:1}
  100%{opacity:0;transform:translateY(-55%)}
}
.ending-kanji{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  font-size:clamp(52px,15vw,86px);
  font-weight:600;
  letter-spacing:.05em;
  color:#f4f4f4;
  opacity:0;
  transform:scale(.88);
  text-shadow:0 0 18px rgba(255,255,255,.12);
}
.ending-kanji.play{
  animation:kanjiAppear 4.2s ease forwards;
}
@keyframes kanjiAppear{
  0%{opacity:0;transform:scale(.88);filter:blur(4px)}
  35%{opacity:.82;filter:blur(1px)}
  70%{opacity:1;transform:scale(1.03);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}
.ending-home{
  position:absolute;
  left:50%;
  bottom:calc(var(--safe-bottom) + 30px);
  transform:translateX(-50%);
  min-width:150px;
  min-height:48px;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.72);
  font-size:14px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
}
.ending-home.show{
  animation:homeFade 1.2s ease forwards;
  pointer-events:auto;
}
@keyframes homeFade{
  from{opacity:0}
  to{opacity:1}
}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"><main class="phone">
<section id="titleScreen" class="title-screen">
  <img class="title-bg" src="00_start.PNG?v=9" alt="Toryanse start screen">
  <button id="startBtn" class="start-hotspot" aria-label="Start">Start</button>
  <div class="en-test-note">English test build — title artwork will be localized next.</div>
</section>

<section id="gameScreen" class="screen hidden">
  <img id="bg" class="bg" alt="">
  <div class="vignette"></div>
  <div class="topbar">
    <div id="sceneLabel" class="chip">Scene</div>
    <div id="timeLabel" class="chip">Present</div>
  </div>
  <div id="story" class="story"></div>
  <div class="controls">
    <button id="leftBtn" class="btn secondary">Back</button>
    <button id="rightBtn" class="btn">Next</button>
    <button id="timeBtn" class="btn full time-guide hidden">LEFT → RIGHT　TO THE PAST</button>
  </div>
  <div id="wipe" class="wipe"></div>
  <div id="flash" class="flash"></div>
</section>

<section id="endingScreen" class="ending-screen hidden">
  <div id="endingCredits" class="ending-credits">
    Created by　恋する魔女<br>
    Programming　ChatGPT<br>
    Graphics　ChatGPT
  </div>
  <div id="endingKanji" class="ending-kanji">THE END</div>
  <button id="endingHome" class="ending-home">Back to Title</button>
</section>
</main></div>

<script>
function candidates(base){
  return [
    base+".png", base+".PNG", base+".jpg", base+".jpeg",
    base+" .PNG", base+" .png",
    base+".png.PNG", base+".png .PNG", base+".PNG.PNG", base
  ];
}
const ASSETS={
  izakaya:candidates("01_izakaya"),
  station:candidates("02_station"),
  train:candidates("03_train"),
  currentCrossing:candidates("04_current_crossing"),
  currentLadybug:candidates("05_current_ladybug"),
  pastCrossing:["06_past_crossing.png.PNG?v=13","06_past_crossing.png%20.PNG?v=13"],
  fatherCrossing:["06_past_crossing.PNG?v=13"],
  pastLadybug:candidates("07_past_ladybug"),
  currentSignal:candidates("08_current_signal"),
  pastSignal:candidates("09_past_signal"),
  conductorWake:candidates("10_conductor_wake"),
  awake:candidates("11_awake"),

  shopping:["%20%20%20%2012_shopping.PNG?v=8"],
  fatherHelp:["%20%20%20%2013_father_help.PNG?v=8"],
  tea:["%20%20%20%2014_tea.PNG?v=8"],
  familyDinner:["15_family_dinner%20.PNG?v=8"],
  familyPhoto:["%20%20%20%2016_family_photo.PNG?v=8"],
  shoulderMassage:["%20%20%20%2017_shoulder_massage.PNG?v=8"],
  ladybugLesson:["%20%20%20%2018_ladybug_lesson.PNG?v=8"]
};

const scenes=[
 {image:ASSETS.izakaya,time:"Present",label:"Izakaya",speaker:"Me",
  text:"Today was one disaster after another.<br><br>I got chewed out at work, and before I knew it, it was already this late.",textClass:"small"},
 {image:ASSETS.station,time:"Present",label:"Last Train",speaker:"Me",
  text:"When I left the izakaya, it was already time for the last train.<br><br>A train glided up to the nearly empty platform.",textClass:"small"},
 {image:ASSETS.train,time:"Present",label:"On the Train",speaker:"Me",
  text:"The moment I sat down, all the strength drained from my body.<br><br>I only meant to close my eyes for a moment.",textClass:"small"},

 {pair:true,label:"Intersection",textClass:"high",
  current:{image:ASSETS.currentCrossing,time:"Present",speaker:"Me",
           text:"I've seen this intersection before.<br><br>Why does something about it feel wrong?"},
  past:{image:ASSETS.pastCrossing,time:"Past",speaker:"Me",
        text:"It looks similar.<br><br>But this is not the same place.<br>The air, the streets—everything is from a much earlier time."}},

 {pair:true,ladybug:true,label:"Seven-spotted Ladybug",
  current:{image:ASSETS.currentLadybug,time:"Present",speaker:"Me",
           text:"A seven-spotted ladybug had landed on my jacket pocket.<br><br>A premonition...? Something feels wrong."},
  past:{image:ASSETS.pastLadybug,time:"Past",speaker:"Dad",
        text:"A seven-spotted ladybug had landed on Dad's chest pocket too.<br><br>\"A premonition, huh...? Hope it's nothing.\""}},

 {image:ASSETS.ladybugLesson,time:"Past",label:"Mushi no Shirase",speaker:"Childhood Me",
  text:"\"Dad, what's that?\"<br><br>Dad pointed to the seven-spotted ladybug on his shoulder.<br><br>\"We call this mushi no shirase—a premonition. Remember that!\"",textClass:"small high"},

 {image:ASSETS.shopping,time:"Past",label:"Act of Gratitude 1 / 6",speaker:"Me",
  text:"I went shopping with Mom and carried all the bags I could hold.<br><br>Mom: \"Thank you. That really helped.\"",textClass:"small high"},

 {image:ASSETS.fatherHelp,time:"Past",label:"Act of Gratitude 2 / 6",speaker:"Dad",
  text:"\"Can you hold this for me?\"<br><br>Me: \"Sure.\"<br><br>Dad: \"Thanks. That's a big help.\"",textClass:"small high"},

 {image:ASSETS.tea,time:"Past",label:"Act of Gratitude 3 / 6",speaker:"Me",
  text:"I made tea for Mom and Dad.<br><br>Mom: \"Thank you.\"",textClass:"small high"},

 {image:ASSETS.familyDinner,time:"Past",label:"Act of Gratitude 4 / 6",speaker:"Me",
  text:"That evening, instead of rushing away from the table, I stayed and listened to Mom and Dad.<br><br>Mom: \"Thanks for staying with us tonight.\"",textClass:"small high"},

 {image:ASSETS.familyPhoto,time:"Past",label:"Act of Gratitude 5 / 6",speaker:"Me",
  text:"The three of us took a family photo.<br><br>Mom: \"Thank you. That's a lovely picture.\"",textClass:"small high"},

 {image:ASSETS.shoulderMassage,time:"Past",label:"Act of Gratitude 6 / 6",speaker:"Dad",
  text:"\"Oh, that feels good. Thanks.\"<br><br>At last, I understood.<br><br>\"...So this was enough.\"",textClass:"small high"},

 {image:ASSETS.train,time:"Present",label:"Last Stop",speaker:"Train Announcement",
  text:"\"This train will soon arrive at its final stop.<br>Please make sure you have all your belongings.\"<br><br>I slowly closed my eyes once more.",textClass:"small"},

 {pair:true,label:"Traffic Light",textClass:"high",
  current:{image:ASSETS.currentSignal,time:"Present",speaker:"Me",
           text:"A small crowd had gathered on the other side of the intersection.<br><br>There were still signs of an accident on the road.<br>A strange uneasiness stirred in my chest."},
  past:{image:ASSETS.fatherCrossing,time:"Past",speaker:"Me",
        text:"Dad was just about to step into the intersection.<br><br>—If he goes now, he'll be hit by a car."}},

 {image:ASSETS.fatherCrossing,time:"Past",label:"Final Act of Gratitude",speaker:"Me",
  text:"\"Dad! Dad!\"<br><br>Dad turned around.<br><br>\"What's wrong?\"<br><br>\"...Thank you for everything.\"",textClass:"small high",flashAfter:true},

 {image:ASSETS.train,time:"Present",label:"The Boundary",speaker:"Dad's Voice",
  text:"\"Thank you.<br>It's all right now.\"",textClass:"high"},

 {image:ASSETS.conductorWake,time:"Present",label:"Last Stop",speaker:"Conductor",
  text:"\"Sir? Sir?<br>We're almost at the end of the line.\"",textClass:"small"},

 {image:ASSETS.awake,time:"Present",label:"On the Train",speaker:"Me",
  text:"My eyes snapped open.<br><br>The weight that had been sitting in my chest felt just a little lighter.",textClass:"small"}
];

const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");
const startBtn=document.getElementById("startBtn");
const bg=document.getElementById("bg");
const story=document.getElementById("story");
const sceneLabel=document.getElementById("sceneLabel");
const timeLabel=document.getElementById("timeLabel");
const leftBtn=document.getElementById("leftBtn");
const rightBtn=document.getElementById("rightBtn");
const timeBtn=document.getElementById("timeBtn");
const wipe=document.getElementById("wipe");
const flash=document.getElementById("flash");
const endingScreen=document.getElementById("endingScreen");
const endingCredits=document.getElementById("endingCredits");
const endingKanji=document.getElementById("endingKanji");
const endingHome=document.getElementById("endingHome");

let sceneIndex=0,era="current",touchStartX=0,touchStartY=0,locked=false;
let imageRequestId=0,lastTime="Present";

function loadImage(list){
  const requestId=++imageRequestId;
  const urls=list.slice();
  let i=0;

  function attempt(){
    if(requestId!==imageRequestId) return;
    if(i>=urls.length){
      story.innerHTML='<span class="speaker">Image Error</span>Please check the image filename.';
      return;
    }

    const url=urls[i++];
    const probe=new Image();

    probe.onload=()=>{
      if(requestId!==imageRequestId) return;
      bg.src=url;
    };

    probe.onerror=()=>{
      if(requestId!==imageRequestId) return;
      attempt();
    };

    probe.src=url;
  }

  attempt();
}

function preloadAll(){
  const groups=Object.values(ASSETS);
  groups.forEach(list=>{
    const im=new Image();
    let i=0;
    im.onerror=()=>{i++; if(i<list.length) im.src=list[i];};
    im.src=list[0];
  });
}
window.addEventListener("load",()=>setTimeout(preloadAll,250));

function currentScene(){return scenes[sceneIndex]}
function currentView(){
  const sc=currentScene();
  return sc.pair?(era==="current"?sc.current:sc.past):sc;
}
function render(){
  const sc=currentScene(),view=currentView();
  loadImage(view.image);
  sceneLabel.textContent=sc.label||"";
  timeLabel.textContent=view.time||"Present";

  story.className="story";
  const classes=(sc.textClass||"").split(/\s+/).filter(Boolean);
  classes.forEach(c=>story.classList.add(c));
  if(sc.ladybug)story.classList.add("ladybug");
  story.innerHTML=(view.speaker?`<span class="speaker">${view.speaker}</span>`:"")+(view.text||"");

  leftBtn.textContent=sceneIndex===0?"Title":"Back";
  rightBtn.textContent="Next";

  if(sc.pair){
    timeBtn.classList.remove("hidden");
    timeBtn.textContent=era==="current"?"LEFT → RIGHT　TO THE PAST":"RIGHT → LEFT　TO THE PRESENT";
  }else{
    timeBtn.classList.add("hidden");
  }
  lastTime=view.time||"Present";
}
function playEnding(){
  gameScreen.classList.add("hidden");
  endingScreen.classList.remove("hidden");

  endingCredits.classList.remove("play");
  endingKanji.classList.remove("play");
  endingHome.classList.remove("show");
  void endingCredits.offsetWidth;

  endingCredits.classList.add("play");

  setTimeout(()=>{
    endingKanji.classList.add("play");
  }, 2600);

  setTimeout(()=>{
    endingHome.classList.add("show");
  }, 6200);
}

function next(){
  if(locked)return;
  const sc=currentScene();
  if(sc.flashAfter){
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
  }
  if(sceneIndex>=scenes.length-1){
    playEnding();
    return;
  }
  sceneIndex++;
  era="current";
  render();
}
function prev(){
  if(locked)return;
  if(sceneIndex===0){
    gameScreen.classList.add("hidden");
    titleScreen.classList.remove("hidden");
    return;
  }
  sceneIndex--;
  era="current";
  render();
}
function changeEra(target){
  const sc=currentScene();
  if(!sc.pair||locked||era===target)return;
  locked=true;
  const past=target==="past";
  wipe.className="wipe"; void wipe.offsetWidth;
  wipe.classList.add(past?"go-right":"go-left");
  setTimeout(()=>{era=target;render()},475);
  setTimeout(()=>{wipe.className="wipe";locked=false},980);
}
startBtn.onclick=()=>{
  titleScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");
  sceneIndex=0; era="current"; render();
};
endingHome.onclick=()=>{
  endingScreen.classList.add("hidden");
  titleScreen.classList.remove("hidden");
  sceneIndex=0;
  era="current";
};
leftBtn.onclick=prev;
rightBtn.onclick=next;
timeBtn.onclick=()=>changeEra(era==="current"?"past":"current");

gameScreen.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0]; touchStartX=t.clientX; touchStartY=t.clientY;
},{passive:true});
gameScreen.addEventListener("touchend",e=>{
  if(!currentScene().pair)return;
  const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;
  changeEra(dx>0?"past":"current");
},{passive:true});
</script>
</body>
</html>
